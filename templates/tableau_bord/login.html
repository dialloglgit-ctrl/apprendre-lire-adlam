<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration PROMET</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1d2327;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .login-wrap{background:#2c3338;border-radius:12px;padding:3rem 2.5rem;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .login-logo{text-align:center;margin-bottom:2rem}
  .login-logo span{font-family:'Noto Sans Adlam',serif;font-size:2.5rem;color:#2271b1}
  .login-logo h1{color:#fff;font-size:1.3rem;font-weight:700;margin-top:.5rem}
  .login-logo p{color:#8c8f94;font-size:.82rem;margin-top:.25rem}
  label{display:block;color:#c3c4c7;font-size:.82rem;font-weight:600;margin-bottom:.4rem;margin-top:1.2rem}
  input{width:100%;padding:.75rem 1rem;background:#1d2327;border:1px solid #3c434a;border-radius:6px;color:#fff;font-size:.95rem;transition:border-color .2s}
  input:focus{outline:none;border-color:#2271b1;box-shadow:0 0 0 2px rgba(34,113,177,.25)}
  .btn-login{width:100%;margin-top:1.75rem;padding:.85rem;background:#2271b1;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s}
  .btn-login:hover{background:#135e96}
  .error{background:#f0b849;color:#1d2327;border-radius:6px;padding:.7rem 1rem;margin-top:1rem;font-size:.85rem;font-weight:700;text-align:center}
  .back{text-align:center;margin-top:1.5rem}
  .back a{color:#50b9e3;font-size:.82rem;text-decoration:none}
  .back a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <span>𞤆𞤪𞤮</span>
    <h1>PROMET Administration</h1>
    <p>Tableau de bord sécurisé</p>
  </div>
  {% if erreur %}
  <div class="error">❌ {{ erreur }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="username">Nom d'utilisateur</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn-login" type="submit">Se connecter →</button>
  </form>
  <div class="back"><a href="/">← Retour au site</a></div>
</div>
</body>
</html>
